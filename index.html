<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 8px;
            margin: 8px;
            width: 220px;
            font-size: 14px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #0077cc;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #005fa3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #222;
            white-space: pre-line;
        }

        .result.high {
            color: #c62828;
        }

        .result.low {
            color: #2e7d32;
        }
    </style>
</head>

<body>

    <h1>Smart Traffic Prediction System</h1>

    <p>Enter details below to predict traffic congestion level.</p>

    <!-- INPUT FIELDS (REQUIRED FOR script.js) -->
    <input id="city" type="text" placeholder="City name"><br>

    <input id="hour" type="number" min="0" max="23" placeholder="Hour (0–23)"><br>

    <input id="traffic" type="number" placeholder="Traffic volume"><br>

    <!-- BUTTON -->
    <button onclick="predict()">Predict Traffic</button>

    <!-- RESULT -->
    <p id="result"></p>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
