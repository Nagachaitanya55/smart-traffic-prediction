<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #0077cc;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #005fa3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>

<body>

    <h1>Smart Traffic Prediction System</h1>

    <p>Click the button below to predict traffic congestion level.</p>

    <button onclick="predictTraffic()">Predict Traffic</button>

    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
